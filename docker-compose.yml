    cpus: 0.2
    depends_on:
      - keycloak
      - vg-ms-auth
      - vg-ms-usuarios
      - vg-ms-entidades
      - vg-ms-alertas
      - vg-ms-recursos
      - vg-ms-subasignacion
      - vg-ms-incidentes
      - vg-ms-communications
      - vg-ms-catalogos 
      - vg-ms-castigos
      - vg-ms-municipalidades
      - vg-ms-flota-mantenimiento
    restart: unless-stopped
    networks:
      - vg-network

