x-jvm-defaults: &jvm-defaults
  # Memoria acotada: heap fijo + lÃƒÆ’Ã‚Â­mites de no-heap para quedar
  JAVA_TOOL_OPTIONS: "-Dreactor.netty.ioWorkerCount=4 -Dreactor.netty.ioSelectCount=1 -Xms64m -Xmx128m -Xss256k -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=32m -XX:TieredStopAtLevel=1 -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
  # Swagger apagado en todos los micros
  SPRINGDOC_APIDOCS_ENABLED: "false"
  SPRINGDOC_SWAGGERUI_ENABLED: "false"
  LOGGING_LEVEL_ROOT: WARN
  # Token compartido para /internal/** entre micros (mismo valor en todos)
  # Audiencia exigida en el JWT (gateway, usuarios, castigos, municipalidades). VacÃƒÆ’Ã‚Â­o = sin validar aud.
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
  # Token compartido para /internal/** entre micros (mismo valor en todos)
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  keycloak:
    # Imagen propia pre-compilada
    image: andrehermoza/prs-keycloak:26.2.4-2
    container_name: prs-keycloak
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /opt/keycloak/data/import
        # Baked realm first; the local bind mount (if present) overrides it.
        cp -f /opt/keycloak/realm-seed/*.json /opt/keycloak/data/import/ 2>/dev/null || true
        cp -f /tmp/keycloak-realm/*.json /opt/keycloak/data/import/ 2>/dev/null || true
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm --http-port=8090
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      # Heap acotado (por defecto Keycloak toma el 70% del mem_limit).
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    # Sin ports en Dokploy (Traefik / red interna). Local: descomenta o usa KEYCLOAK_HOST_PORT.
    expose:
     - "8090"
    # ports:
    #  - "${KEYCLOAK_HOST_PORT:-8090}:8090"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm:/tmp/keycloak-realm:ro
    # 0.5 CPU made token/JWK requests exceed client timeouts
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - vg-network

  vg-ms-entidades:
    image: josemariavalenzuela/vg-ms-entidades:1.4
    container_name: vg-ms-entidades
    environment:
      <<: *jvm-defaults
      SERVER_PORT: 9002
      SPRING_DATA_MONGODB_URI: ${SPRING_MONGODB_URI_ENTIDADES}
      MUNICIPALIDADES_SERVICE_URL: http://vg-ms-municipalidades:9011
      COMMUNICATIONS_SERVICE_URL: http://vg-ms-communications:9008
      CHAT_SERVICE_URL: http://vg-ms-communications:9008
      JWT_SECRET: ${JWT_SECRET}
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_TOKEN_MODE: KEYCLOAK
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/PRS}
      KEYCLOAK_JWK_SET_URI: http://prs-keycloak:8090/realms/PRS/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://prs-keycloak:8090/realms/PRS/protocol/openid-connect/certs
    expose:
      - "9002"
    mem_limit: 250m
    memswap_limit: 250m 
    cpus: 0.2
    depends_on:
      - keycloak
      - kafka
    restart: unless-stopped
    networks:
