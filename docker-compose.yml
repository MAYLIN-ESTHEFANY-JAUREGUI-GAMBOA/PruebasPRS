      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USER: "${MAIL_USER:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-noreply@caneteseguro.pe}"
    expose:
      - "9010"
    # ports:
    #   - "${USUARIOS_HOST_PORT:-9010}:9010"
    mem_limit: 250m
    memswap_limit: 250m  
    cpus: 0.2
